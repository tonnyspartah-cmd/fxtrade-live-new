<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FXTRADE.live — Deriv</title>
<meta name="description" content="FXTRADE.live Deriv market dashboard">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span>FX</span>TRADE<small>.live</small></div>
    <button class="hamburger" aria-label="Menu">☰</button>
  </header>

  <section class="accountbar">
    <div class="mode-buttons">
      <button class="mini-btn">☰</button>
      <button class="mini-btn active">P</button>
      <button class="mini-btn">R</button>
    </div>
    <div class="account-info">
      <span id="accountLabel">Demo Account</span>
      <strong id="balance">$10,000.00</strong>
    </div>
    <button id="connectDeriv" class="connect">Connect Deriv</button>
    <select id="accountType" class="account-type" aria-label="Account type">
      <option value="demo">DEM</option>
      <option value="real">REAL</option>
    </select>
  </section>

  <nav class="contract-nav">
    <button class="contract active" data-contract="MATCHDIFF">● Matches/Differs</button>
    <button class="contract" data-contract="EVENODD">▦ Even/Odd</button>
    <button class="contract" data-contract="OVERUNDER">⇅ Over/Under</button>
    <button class="contract" data-contract="RISEFALL">↕ Rise/Fall</button>
  </nav>

  <main>
    <section class="market-card">
      <div class="market-row">
        <select id="market" class="market-select">
          <option value="1HZ100V">Vol 100 (1s)</option>
          <option value="1HZ50V">Vol 50 (1s)</option>
          <option value="1HZ30V">Vol 30 (1s)</option>
          <option value="1HZ25V">Vol 25 (1s)</option>
          <option value="1HZ10V">Vol 10 (1s)</option>
          <option value="R_100">Volatility 100</option>
          <option value="R_75">Volatility 75</option>
          <option value="R_50">Volatility 50</option>
        </select>
        <div class="price"><strong id="price">—</strong><span>Live</span></div>
      </div>

      <div class="chart-wrap">
        <canvas id="chart"></canvas>
        <div class="chart-fade"></div>
      </div>

      <div id="digitGrid" class="digit-grid"></div>
    </section>

    <section class="mode-switch">
      <button id="autoMode" class="selected">AUTO</button>
      <button id="manualMode">MANUAL</button>
    </section>

    <section class="trade-card">
      <div class="stake-title">STAKE</div>
      <div class="stake-control">
        <button data-delta="-1">−</button>
        <strong id="stake">1</strong>
        <button data-delta="1">+</button>
      </div>
      <div class="presets">
        <button data-stake="1">$1</button>
        <button data-stake="5">$5</button>
        <button data-stake="10">$10</button>
        <button data-stake="25">$25</button>
        <button data-stake="50">$50</button>
        <button data-stake="100">$100</button>
      </div>

      <div class="risk-grid">
        <label>Target Profit<input id="targetProfit" type="number" min="0" step="0.01" value="3"></label>
        <label>Stop Loss<input id="stopLoss" type="number" min="0" step="0.01" value="999"></label>
        <label>Multiplier<select id="multiplier"><option value="1">× 1</option><option value="2" selected>× 2</option><option value="3">× 3</option></select></label>
      </div>
      <div id="riskStatus" class="risk-status">Risk limits active</div>
    </section>

    <section class="live-row">
      <span id="connection"><i></i> LIVE</span>
      <span>0 T</span><span id="wins">0 W</span><span id="losses">0 L</span>
      <strong id="sessionNet">+$0.00</strong><button id="stopTrade" class="stop-trade" type="button">■ STOP</button>
    </section>

    <section class="signal-card">
      <div class="signal-head"><span>FXTRADE AI SIGNAL</span><strong id="confidence">95%</strong></div>
      <div id="direction" class="signal">WAIT</div>
      <p id="signalText">Waiting for live market data.</p>
    </section>

    <section class="trade-actions">
      <div>
        <button id="over" class="trade over">↑ <span id="leftTradeLabel">MATCH</span></button>
        <small id="leftRule">Current digit</small>
      </div>
      <div class="ai-action">
        <button id="place" class="ai-trade">AI TRADE</button>
        <small>Potential payout <b id="payout">$1.96</b></small>
      </div>
      <div>
        <button id="under" class="trade under">↓ <span id="rightTradeLabel">DIFFER</span></button>
        <small id="rightRule">Other digits</small>
      </div>
    </section>

    <div class="bottom-status">
      <span>• Live market connected</span>
      <button id="reset">↻ Reset</button>
    </div>
  </main>

  <footer>
    <button class="bottom active">▥<small>Trade</small></button>
    <button class="bottom">✦<small>AI</small></button>
    <button class="bottom">◷<small>Positions</small></button>
  </footer>
</div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
