<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FXTRADE.live</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="icon-btn" aria-label="Menu">☰</button>
    <div class="brand"><div class="logo"><span>FX</span>TRADE<span>.live</span></div><div class="tag">TRADE SMARTER • TRADE FASTER</div></div>
    <div class="top-actions"><button class="icon-btn">⌯</button><button class="icon-btn">♡</button><button class="icon-btn">⋮</button></div>
  </header>
  <div class="app-banner"><div class="spark">✦</div><div><b>Try the FXTRADE App</b><small>A better trading experience</small></div><button>Download</button><span>×</span></div>
  <section class="controlbar"><button class="mini-menu">☰</button><button class="pr active">P</button><button class="pr">R</button><select id="market"><option value="1HZ90V">Vol 90 (1s)</option><option value="1HZ100V">Vol 100 (1s)</option><option value="1HZ75V">Vol 75 (1s)</option><option value="1HZ50V">Vol 50 (1s)</option><option value="1HZ30V">Vol 30 (1s)</option><option value="1HZ25V">Vol 25 (1s)</option><option value="1HZ15V">Vol 15 (1s)</option><option value="1HZ10V">Vol 10 (1s)</option></select><button class="deposit">Deposit</button><button class="bell">♧<sup>+</sup></button></section>
  <nav class="contract-tabs"><button class="contract">◉ Matches/Differs</button><button class="contract active" data-contract="EVENODD">▣ Even/Odd</button><button class="contract" data-contract="OVERUNDER">↕ Over/Under</button></nav>
  <section class="market-head"><div><button class="zoom">+</button><button class="zoom">⛶</button><button class="zoom">−</button></div><div class="market-title"><b id="marketName">Vol 90 (1s)</b><span id="priceHeader">—</span></div><span class="change" id="change">↑ 0.00%</span><span class="chart-pct">100%</span></section>
  <section class="chart-wrap"><canvas id="chartCanvas"></canvas><div class="axis"><span id="axis1">—</span><span id="axis2">—</span><span id="axis3">—</span><span id="axis4">—</span></div></section>
  <section class="digits-pill" id="digitGrid"></section>
  <section class="mode"><button class="mode active">AUTO</button><button class="mode">MANUAL</button></section>
  <section class="stake-panel"><div class="stake-line"><button data-delta="-1">−</button><div><label>STAKE</label><strong id="stake">0.25</strong></div><button data-delta="1">+</button></div><div class="presets"><button data-stake="1">$1</button><button data-stake="5">$5</button><button data-stake="10">$10</button><button data-stake="25">$25</button><button data-stake="50">$50</button><button data-stake="100">$100</button></div><div class="risk-row"><div><b>TARGET PROFIT</b><input id="targetProfit" value="3" type="number" step="0.01"></div><div><b>STOP LOSS</b><input id="stopLoss" value="999" type="number" step="0.01"></div><div><b>MULTIPLIER</b><input value="2" type="number" step="1"></div></div><div class="live-row"><span>🟡 <b>LIVE</b> <strong id="wins">77</strong> - <strong id="losses">5W-2L</strong></span><em id="sessionNet">+$1.18</em></div></section>
  <section class="action-row"><button id="tradeAction" class="trade-action">Even <small id="demoPayout">Demo payout</small><span id="evenPct">50.00</span></button><button id="stopTrade" class="stop">■ STOP</button></section>
  <div class="connection"><span id="connection">● Connecting…</span><span id="tickCount">0 ticks</span></div>
  <footer><button>▥<small>Trade</small></button><button class="ai">✦<small>AI</small></button><button>▤<small>Positions</small></button></footer>
</div>
<script src="app.js"></script>
</body>
</html>
