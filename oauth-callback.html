<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FXTRADE — Connecting Deriv</title></head><body style="font-family:Arial;padding:32px;background:#08110f;color:#fff"><h2>Connecting to Deriv…</h2><p id="msg">Please wait.</p><script>
(async()=>{const msg=document.getElementById('msg');try{const q=new URLSearchParams(location.search);const code=q.get('code'),state=q.get('state');if(!code)throw Error(q.get('error_description')||q.get('error')||'No authorization code');if(state!==sessionStorage.getItem('fxtrade_oauth_state'))throw Error('OAuth state mismatch');const verifier=sessionStorage.getItem('fxtrade_pkce_verifier');const c=await fetch('/api/config').then(r=>r.json());const r=await fetch('/api/oauth/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,code_verifier:verifier,redirect_uri:location.origin+'/oauth-callback.html',client_id:c.client_id})});const d=await r.json();if(!r.ok||!d.access_token)throw Error(d.error||'Token exchange failed');sessionStorage.setItem('fxtrade_deriv_token',d.access_token);sessionStorage.removeItem('fxtrade_pkce_verifier');sessionStorage.removeItem('fxtrade_oauth_state');location.replace('/');}catch(e){msg.textContent=e.message||'Connection failed';}})();</script></body></html>
